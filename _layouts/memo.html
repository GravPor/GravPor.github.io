---
layout: default
---

<div class="memo-wrapper">
  <div class="memo-slider">

    {% assign memos = site.memo | sort: "date" | reverse %}
    {% for memo in memos %}
      <section class="memo-slide">
        <article>
          <h3>{{ memo.title }}</h3>
          <small>{{ memo.date | date: "%Y-%m-%d" }}</small>

          {{ memo.content }}
        </article>
      </section>
    {% endfor %}

  </div>
</div>
